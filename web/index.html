<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voxelle</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <p class="startup-status" role="status">Opening Voxelle…</p>
    </main>
    <script>
      window.addEventListener("error", (event) => {
        if (document.querySelector("#app")?.dataset.fatalHandled === "true") return;
        document.querySelector("#app").textContent = `Voxelle failed to render: ${event.message}`;
      });
      window.addEventListener("unhandledrejection", (event) => {
        if (document.querySelector("#app")?.dataset.fatalHandled === "true") return;
        const message = event.reason?.message ?? String(event.reason);
        document.querySelector("#app").textContent = `Voxelle failed to render: ${message}`;
      });
    </script>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
