[workspace]
members = [
  "crates/voxelle-app",
  "crates/voxelle-tauri-host",
  "crates/voxelle-cli",
  "crates/voxelle-inhabitantd",
  "crates/voxelle-core",
  "crates/voxelle-net",
  "crates/voxelle-store",
  "crates/voxelle-sync",
  "crates/voxelle-update",
  "crates/voxelle-release",
]
resolver = "2"

# Native development builds exercise the real cryptographic admission/projection
# path. Keep curve arithmetic optimized so debug stepping in Voxelle does not
# turn routine local reads into multi-second operations on slower CPUs.
[profile.dev.package.curve25519-dalek]
opt-level = 3

[profile.dev.package.ed25519-dalek]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
