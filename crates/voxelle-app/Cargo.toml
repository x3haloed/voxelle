[package]
name = "voxelle-app"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
dirs = "6"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt", "sync", "time"] }
ts-rs = "12"
voxelle-core = { path = "../voxelle-core" }
voxelle-net = { path = "../voxelle-net" }
voxelle-store = { path = "../voxelle-store" }
voxelle-sync = { path = "../voxelle-sync" }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }
