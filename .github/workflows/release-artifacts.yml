name: unsigned release artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.9' --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Test web shell
        run: node --test web/src/*.test.mjs
      - name: Build universal DMG
        working-directory: crates/voxelle-tauri-host
        run: cargo tauri build --locked --target universal-apple-darwin --bundles dmg
      - name: Write checksum
        run: cd target/universal-apple-darwin/release/bundle/dmg && shasum -a 256 *.dmg > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: voxelle-macos-universal-unsigned
          path: target/universal-apple-darwin/release/bundle/dmg/*
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2.9' --locked
      - name: Test
        run: cargo test --workspace --locked
      - name: Test web shell
        run: node --test web/src/*.test.mjs
      - name: Build NSIS installer
        working-directory: crates/voxelle-tauri-host
        run: cargo tauri build --locked --bundles nsis
      - name: Write checksum
        shell: pwsh
        run: |
          $dir = "target/release/bundle/nsis"
          Get-ChildItem $dir -Filter *.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)"
          } | Set-Content "$dir/SHA256SUMS.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: voxelle-windows-x64-unsigned
          path: target/release/bundle/nsis/*
          if-no-files-found: error
